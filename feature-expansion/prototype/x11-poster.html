<style>.lay{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;font-size:13.5px;font-weight:600}
.lay i{width:30px;height:30px;border-radius:8px;display:block;flex:none}
.trk{position:relative;height:42px;border-radius:12px;background:var(--soft);margin-top:8px;overflow:hidden}
.trk b{position:absolute;top:8px;height:26px;border-radius:8px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);left:20%;animation:play 4s linear infinite}@keyframes play{to{left:92%}}</style>

<div class="sub rise" style="--d:0">Aurora Bloom.tendies · 3 layers · Lock → Unlock</div>

    <div style="position:absolute;top:22px;width:100%;text-align:center;color:#fff;font:600 40px 'Inter Display';letter-spacing:-.04em">9:41</div>
