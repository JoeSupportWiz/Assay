name: Assay iOS CI
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to build"
        type: choice
        options: [screenshots, ipa]
        default: screenshots
      capture_set:
        description: "Full gallery or the four new utility screens"
        type: choice
        options: [all, four-utilities, studio, acceptance, brand-audit, device-workflows]
        default: all
      commit_screens:
        description: "Commit screenshots to docs/app-screens"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Toolchain
        run: xcodebuild -version && xcrun simctl list runtimes | tail -5

      - name: Verify real utilities on local fixtures
        run: |
          set -eu
          swiftc -parse-as-library App/Features/AppleTeam/TeamPortal.swift tests/apple-team/TeamFixture.swift -o "$RUNNER_TEMP/team-test"
          "$RUNNER_TEMP/team-test"
          swiftc -parse-as-library App/Core/Catalog.swift App/Features/PresetFiles/PortableEdits.swift tests/preset-files/Fixture.swift -o "$RUNNER_TEMP/preset-test"
          "$RUNNER_TEMP/preset-test"
          swiftc -parse-as-library App/Features/DisplayPreset/DisplayPresetCopy.swift tests/display-preset/Fixture.swift -o "$RUNNER_TEMP/display-preset-test"
          "$RUNNER_TEMP/display-preset-test"
          python3 scripts/package-mac-helper.py --check
          python3 -m unittest discover -s integrations/minis/tests
          sh tests/usb-handoff/run.sh
          python3 -m unittest discover -s Mac/usb-backup -p 'test_*.py'
          sh tests/build-library/run.sh
          swiftc -parse-as-library App/Core/Operations.swift tests/rollback-review/Fixture.swift -o "$RUNNER_TEMP/rollback-test"
          "$RUNNER_TEMP/rollback-test"
          swiftc -parse-as-library App/Features/TestBench/BenchArchive.swift tests/test-bench/Fixture.swift -o "$RUNNER_TEMP/bench-test"
          "$RUNNER_TEMP/bench-test"
          bash tests/layout-studio/smoke.sh
          bash tests/scene-transfer/smoke.sh
          bash tests/palette-lab/smoke.sh
          swiftc -parse-as-library App/Features/CrashReview/CrashReview.swift tests/crash-review/Fixture.swift -o "$RUNNER_TEMP/crash-fixture"
          "$RUNNER_TEMP/crash-fixture"
          python3 scripts/check-fold-assets.py
          sh tests/supporter/run.sh
          swiftc -parse-as-library App/Features/Signet/SignetBinaryEvidence.swift tests/macho/Fixture.swift -o "$RUNNER_TEMP/mach-check"
          "$RUNNER_TEMP/mach-check"
          bash tests/file-vault/run.sh
          swiftc -parse-as-library App/Features/Canvas/CanvasArchive.swift App/Features/Signet/SignetZip.swift tests/canvas/Fixture.swift -o "$RUNNER_TEMP/canvas-test"
          "$RUNNER_TEMP/canvas-test" App/ArtResources/AssayCanvasSample.zip
          bash tests/scenes/smoke.sh
          sh tests/display-check/run.sh
          swiftc App/Features/Signet/SignerPreflightRules.swift App/Features/Signet/SignerPreflightEnvelope.swift tests/signer-preflight/main.swift -o "$RUNNER_TEMP/signet-fixture"
          "$RUNNER_TEMP/signet-fixture"

      # ---------- Screenshots ----------
      - name: Build for simulator
        if: inputs.mode == 'screenshots'
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -project Assay.xcodeproj -scheme Assay -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/build.log | grep -E '(error:|BUILD (SUCCEEDED|FAILED))' || true
          grep -q 'BUILD SUCCEEDED' build/build.log || { echo '::group::compile errors'; grep -E 'error:' build/build.log | sort -u | head -80; echo '::endgroup::'; exit 1; }

      - name: Render screens
        env:
          ASSAY_CAPTURE_SET: ${{ inputs.capture_set }}
        if: inputs.mode == 'screenshots'
        run: bash scripts/screenshots.sh build/dd/Build/Products/Debug-iphonesimulator/Assay.app docs/app-screens

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'screenshots'
        with:
          name: Assay-screens
          path: docs/app-screens
          if-no-files-found: error

      - name: Commit screenshots
        if: inputs.mode == 'screenshots' && inputs.commit_screens
        run: |
          git config user.name "assay-ci"
          git config user.email "assay-ci@users.noreply.github.com"
          git config core.ignorecase false
          git add docs/app-screens
          git diff --cached --quiet || git commit -m "docs: app screenshots (${GITHUB_SHA::7})"
          git push

      # ---------- Unsigned IPA ----------
      - name: Build unsigned archive
        if: inputs.mode == 'ipa'
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Assay.xcodeproj -scheme Assay \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Assay.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive 2>&1 | tee build/archive.log | tail -5
          grep -q 'ARCHIVE SUCCEEDED' build/archive.log || { grep -E 'error:' build/archive.log | sort -u | head -80; exit 1; }

      - name: Package unsigned IPA
        if: inputs.mode == 'ipa'
        run: |
          mkdir -p build/Payload
          cp -R build/Assay.xcarchive/Products/Applications/Assay.app build/Payload/
          cd build && /usr/bin/zip -qry Assay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'ipa'
        with:
          name: Assay-unsigned-ipa
          path: build/Assay-unsigned.ipa
          if-no-files-found: error
