<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<script>const q=new URLSearchParams(location.search);</script>
<style>
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:46px;border-radius:23px;background:var(--card);padding:4px;margin:14px 20px 0}
.seg .knob{position:absolute;top:4px;left:4px;height:38px;width:calc((100% - 8px)/3);border-radius:19px;background:var(--ink);transition:transform .5s var(--spring)}
.seg div.o{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink-2);transition:color .3s}
.seg div.o.on{color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 20px}
.th{border-radius:22px;background:var(--card);padding:10px;position:relative;transition:transform .45s var(--spring),box-shadow .3s}
.th.sel{transform:scale(1.03);box-shadow:0 0 0 2.5px var(--ink),0 14px 30px rgba(0,0,0,.35)}
.th .mini{height:92px;border-radius:14px;overflow:hidden;position:relative;padding:9px;display:flex;flex-direction:column;gap:6px}
.th .nm{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 2px;font-size:14px;font-weight:600}
.th .ck{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--ink-3);display:flex;align-items:center;justify-content:center;transition:all .3s}
.th.sel .ck{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.th .ck svg{opacity:0;transform:scale(.4);transition:all .35s var(--spring)}
.th.sel .ck svg{opacity:1;transform:none}
.mb{border-radius:6px}
.sw{width:40px;height:40px;border-radius:20px;box-shadow:0 0 0 3px var(--card),0 6px 14px rgba(0,0,0,.3)}
</style></head><body class="t-dark">

<svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8.5.6 10.2 10.2 0 0 0 1.3 3.5l1.2 1.2a8.6 8.6 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2a6.8 6.8 0 0 0-9.6 0L4.9 7.1c1-.9 2.2-1.4 3.6-1.4zm0 3.4c.5 0 1 .2 1.3.5L8.5 11 7.2 9.6c.3-.3.8-.5 1.3-.5z"/></svg>

<div class="rise" style="--d:0;display:flex;align-items:center;gap:14px;padding:10px 20px 0">

  </div>
  <div class="th rise" style="--d:6" data-i="3">
    <div class="mini" style="background:radial-gradient(70% 45% at 30% 0%,rgba(255,229,138,.55),transparent 70%),linear-gradient(170deg,#C9783F,#2A1660 65%,#170E2E)">

      <div style="display:flex;gap:6px;flex:1"><div style="flex:1;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:9px"></div><div style="flex:1;background:rgba(255,200,140,.9);border-radius:9px"></div></div>
      <div style="display:flex;gap:5px"><div style="flex:1;height:18px;background:rgba(168,147,255,.4);border-radius:7px"></div><div style="flex:1;height:18px;background:rgba(255,158,107,.4);border-radius:7px"></div></div>

  </div>

<div class="rise card" style="--d:7;margin:14px 20px 0;padding:14px;display:flex;gap:14px;align-items:center">

<div class="rise" style="--d:9;font-size:12px;line-height:1.4;color:var(--ink-3);padding:12px 26px 0">iOS doesn&#39;t share your wallpaper with apps, so colours come from Canvas or a photo you pick.</div>
<div class="home-ind"></div>
<script>
const ths=[...document.querySelectorAll('.th')];
function sel(i){ths.forEach((t,j)=>t.classList.toggle('sel',j===i))}
function mode(i){document.getElementById('knob').style.transform=`translateX(${i*100}%)`;[0,1,2].forEach(j=>document.getElementById('m'+j).classList.toggle('on',j===i))}
if(q.get('demo')){
  // order matches the shot: assay-light, assay-dark, millennium, pinstripe, wallpaper
  const seq=[[0,1],[0,2],[1,0],[2,0],[3,0]]; let k=0;
  const step=()=>{const [t,m]=seq[k%seq.length];sel(t);mode(m);k++};
  setTimeout(()=>{step();setInterval(step,+q.get('demo'))},1800);
}
</script>
