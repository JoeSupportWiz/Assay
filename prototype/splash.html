<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><script>const q=new URLSearchParams(location.search);</script>
<style>
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:5;background:var(--bg);background-image:var(--bgimg);transition:opacity .5s ease,transform .6s var(--ease)}
.stage.out{opacity:0;transform:scale(1.08);pointer-events:none}
.mk{width:118px;height:169px;color:var(--ink);overflow:visible}
.p1{opacity:0;transform:translateY(-8px);animation:fin .55s cubic-bezier(.2,1.25,.35,1) .25s forwards}
.p2{opacity:0;transform:translateY(10px);animation:fin .6s cubic-bezier(.2,1.3,.35,1) .43s forwards}
.p3{opacity:0;transform:translateY(12px) scaleY(.6);transform-origin:50% 80%;animation:fold .6s cubic-bezier(.2,1.5,.35,1) .67s forwards}
@keyframes fin{to{opacity:1;transform:none}}
@keyframes fold{70%{opacity:1;transform:scaleY(1.04)}100%{opacity:1;transform:none}}
.shine{animation:shine .7s ease-in-out 1.05s forwards;transform:translateX(-60px)}
@keyframes shine{to{transform:translateX(90px)}}
.wm{font-family:var(--disp);font-size:40px;font-weight:750;letter-spacing:-.045em;opacity:0;transform:translateY(10px);animation:fin .6s var(--spring) 1.15s forwards}
.tl{font-size:15px;color:var(--ink-2);opacity:0;animation:fin .5s ease 1.4s forwards;margin-top:-14px}
iframe{position:absolute;inset:0;width:393px;height:852px;border:0}
</style></head><body>
<script>document.body.className="t-"+(q.get("t")||"light")</script>
<div id="host"></div>
<div class="stage" id="st">
<svg class="mk" viewBox="17 5.5 50 71.5" fill="currentColor"><defs><clipPath id="c"><path d="M17 25.5Q17 22.8 19.4 21.4L42.5 8.1Q47 5.5 47 10.8V24.2L28.2 35.1Q25.5 36.7 25.5 39.7V51.8Q25.5 54.6 23.1 56L17 59.5Z"/><path d="M34 34.8Q34 32.1 36.4 30.7L62.6 15.6Q67 13.1 67 18.3V44.4Q67 47.1 64.6 48.5L38.4 63.6Q34 66.1 34 60.9Z"/><path d="M34 57.4L54.8 45.4Q57.4 43.9 59.8 45.7L67 51V60.2L41.8 74.7Q37.4 77.2 37.4 72V61.8Q37.4 59.2 34 57.4Z"/></clipPath><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g class="p1"><path d="M17 25.5Q17 22.8 19.4 21.4L42.5 8.1Q47 5.5 47 10.8V24.2L28.2 35.1Q25.5 36.7 25.5 39.7V51.8Q25.5 54.6 23.1 56L17 59.5Z"/></g><g class="p2"><path d="M34 34.8Q34 32.1 36.4 30.7L62.6 15.6Q67 13.1 67 18.3V44.4Q67 47.1 64.6 48.5L38.4 63.6Q34 66.1 34 60.9Z"/></g><g class="p3"><path d="M34 57.4L54.8 45.4Q57.4 43.9 59.8 45.7L67 51V60.2L41.8 74.7Q37.4 77.2 37.4 72V61.8Q37.4 59.2 34 57.4Z"/></g>
<g clip-path="url(#c)"><rect class="shine" x="10" y="0" width="22" height="90" fill="url(#sg)" transform="skewX(-20)"/></g></svg>
<div class="wm">Assay</div><div class="tl">Shows its work.</div>
</div>
<script>
if(q.get('still')){document.querySelectorAll('.p1,.p2,.p3,.wm,.tl').forEach(e=>{e.style.animation='none';e.style.opacity=1;e.style.transform='none'})}
if(q.get('next')){setTimeout(()=>{const f=document.createElement('iframe');f.src='home.html?t='+(q.get('t')||'light');document.getElementById('host').appendChild(f)},2300);setTimeout(()=>document.getElementById('st').classList.add('out'),2450)}
</script>
<div class="home-ind" style="z-index:9"></div>
</body></html>
