<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="light.css">
<style>
.wall{position:absolute;inset:0;border-radius:34px;overflow:hidden}
.before{background:linear-gradient(170deg,#9AA3AE,#59616B)}
.after{background:radial-gradient(60% 50% at 25% 20%,#FFE58A 0,rgba(255,229,138,0) 70%),radial-gradient(55% 45% at 85% 35%,#FF9E6B 0,rgba(255,158,107,0) 70%),radial-gradient(70% 55% at 40% 85%,#8B6CFF 0,rgba(139,108,255,0) 70%),linear-gradient(170deg,#FFB27A,#6E4BE0);clip-path:inset(0 0 0 100%);animation:reveal 1.6s var(--ease) 1s forwards}
.after::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 30% at 60% 55%,rgba(255,255,255,.35),transparent 70%);animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-14%,10%) scale(1.1)}}
@keyframes reveal{to{clip-path:inset(0 0 0 48%)}}
.handle{position:absolute;top:0;bottom:0;left:100%;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.25);animation:slide 1.6s var(--ease) 1s forwards;z-index:3}
.handle i{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:20px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#111}
@keyframes slide{to{left:48%}}
.lock{position:absolute;inset:0;color:#fff;text-align:center;padding-top:44px;z-index:2;text-shadow:0 2px 20px rgba(0,0,0,.15)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--ink-3);margin-right:4px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.chg{opacity:0;transform:translateY(10px) scale(.9);animation:pop .6s var(--spring) forwards}
</style></head><body>
<div class="island"></div>
<div class="status"><span>9:41</span><span class="r">
<svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
<svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8.5.6 10.2 10.2 0 0 0 1.3 3.5l1.2 1.2a8.6 8.6 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2a6.8 6.8 0 0 0-9.6 0L4.9 7.1c1-.9 2.2-1.4 3.6-1.4zm0 3.4c.5 0 1 .2 1.3.5L8.5 11 7.2 9.6c.3-.3.8-.5 1.3-.5z"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".35"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".35"/></svg></span></div>

<div class="rise" style="--d:0;display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0">
  <span class="circ" style="background:#fff"><svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2 2 9l7 7"/></svg></span>
  <div class="disp" style="font-size:19px;font-weight:700">Alchemy</div>
  <span class="chip" style="background:#fff;height:46px;border-radius:23px;padding:0 14px"><span class="dot" style="background:var(--lilac-d)"></span>Ollama</span>
</div>

<div class="rise" style="--d:1;position:relative;margin:16px 20px 0;height:430px;border-radius:34px;box-shadow:0 24px 50px rgba(110,75,224,.28)">
  <div class="wall before"></div>
  <div class="wall after"></div>
  <div class="lock">
    <div style="font-size:15px;font-weight:600;opacity:.9">Thursday 19 November</div>
    <div class="disp" style="font-size:88px;font-weight:600;line-height:1;margin-top:2px;letter-spacing:-.04em">9:41</div>
  </div>
  <div class="handle"><i><svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1 1 6l4 5M13 1l4 5-4 5"/></svg></i></div>
  <span class="chip" style="position:absolute;left:14px;bottom:14px;z-index:4;background:rgba(17,17,19,.55);backdrop-filter:blur(12px);color:#fff">Before</span>
  <span class="chip" style="position:absolute;right:14px;bottom:14px;z-index:4;background:rgba(255,255,255,.8);backdrop-filter:blur(12px)">Draft 2 of 3</span>
</div>

<div class="rise card" style="--d:3;margin:14px 20px 0;padding:14px 16px">
  <div style="display:flex;gap:10px;align-items:flex-start">
    <div class="circ" style="width:32px;height:32px;background:linear-gradient(150deg,#A893FF,#6A47F5);color:#fff"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg></div>
    <div style="flex:1;font-size:14px;line-height:1.4;color:var(--ink-2)"><b style="color:var(--ink);font-weight:600">“Warm dusk, soft grain, keep the clock clear.”</b><br>Here's what I changed:</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-left:42px">
    <span class="chip chg" style="animation-delay:2.4s;background:var(--butter);height:28px">Palette → dusk</span>
    <span class="chip chg" style="animation-delay:2.55s;background:var(--lilac);height:28px">+ Grain 6%</span>
    <span class="chip chg" style="animation-delay:2.7s;background:var(--mint);height:28px">Clock contrast AA</span>
  </div>
</div>

<div class="rise" style="--d:5;display:flex;gap:10px;margin:14px 20px 0">
  <div style="flex:1;height:58px;border-radius:29px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Refine</div>
  <div style="flex:1.4;height:58px;border-radius:29px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px">Review &amp; apply<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h12M8 2l5 5-5 5"/></svg></div>
</div>
<div class="home-ind"></div>
</body></html>
