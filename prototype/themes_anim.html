<!doctype html><html><head><meta charset="utf-8"><style>
:root{--spring:cubic-bezier(.2,1.35,.35,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1200px;overflow:hidden}
body{font-family:Inter,sans-serif;letter-spacing:-.015em;color:#111113;background:#E9E6DE;position:relative;-webkit-font-smoothing:antialiased}
.sphere{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#F4F2EC 35%,#D9D5CB 100%);box-shadow:0 40px 80px rgba(80,70,50,.12)}
.phone{position:absolute;width:421px;height:880px;border-radius:68px;padding:14px;background:linear-gradient(135deg,#3B3B40,#151517 40%,#2E2E33 70%,#0E0E10);box-shadow:0 0 0 1.5px #55555c inset,0 50px 100px rgba(40,35,25,.28),0 12px 30px rgba(40,35,25,.18)}
.phone .scr{width:393px;height:852px;border-radius:55px;overflow:hidden;background:#000}
.phone iframe{width:393px;height:852px;border:0;display:block}
.phone .b{position:absolute;background:#2A2A2E;border-radius:2px}
.fc{position:absolute;background:#fff;border-radius:26px;box-shadow:0 30px 60px rgba(40,35,25,.16),0 6px 16px rgba(40,35,25,.08);opacity:0;transform:translateY(20px) scale(.85);animation:pop .8s var(--spring) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.ph{opacity:0;transform:translateY(60px);animation:pop 1.1s var(--spring) forwards}
.tag{position:absolute;height:40px;padding:0 18px;border-radius:20px;background:#fff;display:flex;align-items:center;font-size:16px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;font-size:13px;font-weight:600}
.dot{width:7px;height:7px;border-radius:4px}

body{background:#DCD8CF}
.lay{position:absolute;inset:0;transition:clip-path .9s cubic-bezier(.65,0,.35,1)}
.lay iframe{width:393px;height:852px;border:0}
.scr{position:relative}
#name{transition:opacity .25s}

<script>
const names=['Assay Light', 'Assay Dark', 'Millennium', 'Pinstripe', 'Wallpaper match'];let k=1;
setTimeout(function go(){
  if(k>=names.length) return;
  document.getElementById('L'+k).style.clipPath='circle(150% at 86% 12%)';
  const n=document.getElementById('name');n.style.opacity=0;const kk=k;setTimeout(()=>{n.textContent=names[kk];n.style.opacity=1},300);
  k++;setTimeout(go,1800);
},3600);
</script></body></html>
