name: Assay
options:
  bundleIdPrefix: com.joesupportwiz
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Assay:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Assay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Assay scans nearby Bluetooth devices only when you open the Bluetooth notebook. Reads only; writes always ask first.
        NSLocalNetworkUsageDescription: Assay looks for services on networks you own or are allowed to test, and for Assay for Mac.
        NSBonjourServices:
          - _assay-companion._tcp
          - _http._tcp
          - _https._tcp
          - _ssh._tcp
          - _smb._tcp
          - _airplay._tcp
          - _raop._tcp
          - _hap._tcp
          - _ipp._tcp
          - _printer._tcp
          - _workstation._tcp
          - _companion-link._tcp
          - _device-info._tcp
          - _googlecast._tcp
          - _spotify-connect._tcp
        NSPhotoLibraryAddUsageDescription: Assay saves wallpapers and posters you create to Photos when you ask.
        NSFaceIDUsageDescription: Assay can lock itself with Face ID.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joesupportwiz.assay
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        PRODUCT_NAME: Assay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
